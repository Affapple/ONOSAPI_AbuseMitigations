# Workload command templates for harness/run.sh: one "NAME = command" per line, '#' = comment.
# The harness fills the placeholders, runs the command with `bash -c` in the run directory and
# records its exit code (non-zero => run invalid). L is required; every other NAME is run by
# `run.sh <config> <NAME> <rep>` from t0+30 to t0+90 ("baseline" = L only).
#   {target}   v1 (C1) or gw (C2/C3/C3F)
#   {duration} 150 for L (starts 30 s before t0, ends at t0+120), 60 for a named workload
#   {out}      results/<config>/<workload>/<rep>/<NAME>.csv
#   {user}     t2-op for L, t1-op for the named workload;  {password} <user>-pw
#   {project}  ~/project
# Anything else (--rate, --variant, ...) is written literally in the command line, so each
# distinct rate/variant needs its own NAME (e.g. S3a, S3b).
# A command that uses {out} must write that CSV (else the run is invalid); one without {out}
# is a placeholder.
# aggregate.py reads every CSV the workload writes with columns ts,status,latency_ms (optional:
# reason, op). Rows are grouped per op when an "op" column exists; status >= 400 counts as a
# rejection (by status:reason), 2xx as success; latency percentiles use the 2xx rows.

L  = python3 {project}/scenarios/l_legit.py --target {target} --user {user} --password {password} --duration {duration} --out {out}

# The user's scenarios (uncomment and fill in):
# S1 = python3 {project}/scenarios/s1_flood.py --target {target} --user {user} --password {password} --duration {duration} --out {out}
# S2 = python3 {project}/scenarios/s2_churn.py --target {target} --user {user} --password {password} --duration {duration} --out {out}
# S3 = python3 {project}/scenarios/s3_semantic.py --target {target} --user {user} --password {password} --duration {duration} --out {out}
# S4 = python3 {project}/scenarios/s4_cross_tenant.py --target {target} --user {user} --password {password} --duration {duration} --out {out}
