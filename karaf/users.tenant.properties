#
# This file contains the users, groups, and roles.
# Each line has to be of the format:
#
# USER=PASSWORD,ROLE1,ROLE2,...
# USER=PASSWORD,_g_:GROUP,...
# _g_\:GROUP=ROLE1,ROLE2,...
#
# All users, groups, and roles entered in this file are available after Karaf startup
# and modifiable via the JAAS command group. These users reside in a JAAS domain
# with the name "karaf".
# --- SDN project overlay 'tenant' (karaf/apply.sh tenant) ---
# C2/C3: tenant accounts only have the custom 'tenant' role (no /onos/v1 access)
# Stock account guest:guest removed: default viewer credentials would let anyone
# read every tenant's rules on /onos/v1, around the gateway. karaf/onos are kept
# unchanged (default admin credentials = "stolen admin credentials", out of scope).
karaf = karaf,_g_:admingroup
onos = rocks,_g_:admingroup
t1-op = t1-op-pw,_g_:tenantgroup
t1-view = t1-view-pw,_g_:tenantgroup
t2-op = t2-op-pw,_g_:tenantgroup
t2-view = t2-view-pw,_g_:tenantgroup
gw-svc = gw-svc-pw,_g_:guestgroup

_g_\:admingroup = group,admin,manager,viewer,systembundles,ssh,webconsole
_g_\:guestgroup = group,viewer
_g_\:tenantgroup = group,tenant
