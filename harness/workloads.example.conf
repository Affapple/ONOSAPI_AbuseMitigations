# Workloads used to test the harness (WORKLOADS=harness/workloads.example.conf).
# L : the legitimate workload (t2-op), runs for the whole run
# S0: harmless placeholder for the attack window (no {out}: writes no CSV)
L  = python3 {project}/scenarios/l_legit.py --target {target} --user {user} --password {password} --duration {duration} --out {out}
S0 = sleep {duration}
